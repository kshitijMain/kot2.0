# Background alerts (P2-06b, WTR-005): with the app in the background, the kitchen marking a dish
# Ready rings the phone with a notification; a tap on it in the shade opens its table, and nothing
# is acknowledged (2026-10-25). Signing out ends the phone's listening. Runs after
# pair-login-tables on the phone it paired (config.yaml sets the order). TABLE2 must be free; DISH
# as there. While the flow waits (up to 5 minutes each), a person marks the dish Ready, then
# Picked up, on the kitchen screen: keep the emulator's screen on (adb shell svc power stayon
# true). Maestro's launchApp allows the notifications that Android 13 and later ask for at sign-in.
appId: ${APP_ID}
env:
  APP_ID: in.rp.waiter.dev
  METRO: http://10.0.2.2:8081
  STAFF_NAME: Ravi
  PIN: '4444'
  TABLE2: T2
  DISH: Dal Makhani
---
- launchApp
- openLink: exp+rp-waiter://expo-development-client/?url=${METRO}
- extendedWaitUntil:
    visible: Tap your name
    timeout: 60000
- tapOn: ${STAFF_NAME}
- tapOn: ${PIN.charAt(0)}
- tapOn: ${PIN.charAt(1)}
- tapOn: ${PIN.charAt(2)}
- tapOn: ${PIN.charAt(3)}
- assertVisible: Tables
- assertNotVisible:
    id: notifications-off
- tapOn: All tables
- tapOn: ${TABLE2}, Free.*
- tapOn:
    id: open-table
- assertVisible: ${TABLE2} is open
- tapOn: Add from the menu
- tapOn:
    id: menu-search
- inputText: ${DISH}
- hideKeyboard
- tapOn: ${DISH},.*
- tapOn:
    id: send-kot
- assertVisible: Order .* sent to the kitchen
# To the background: the phone keeps listening, and its notification says for whom.
- pressKey: Home
- swipe:
    start: 50%, 1%
    end: 50%, 75%
- assertVisible: Alerts for ${STAFF_NAME}
# The kitchen marks the dish Ready: the phone rings with a notification for it. A tap opens the
# app on its table and takes the notification off the shade.
- extendedWaitUntil:
    visible: Table ${TABLE2} · Food ready
    timeout: 300000
- tapOn: Table ${TABLE2} · Food ready
- assertVisible: Table ${TABLE2}
- assertVisible: Alerts, 1 open
# The kitchen marks it Picked up: served, and the alert goes (from the pager too).
- extendedWaitUntil:
    visible: Served
    timeout: 300000
- assertVisible: Alerts, none open
- tapOn: Request bill
- assertVisible: The cashier has been asked for the bill for ${TABLE2}.
- tapOn: Back to tables
- tapOn:
    id: home-menu
- tapOn: Sign out
- assertVisible: Tap your name
# Nobody holds the phone now: it stops listening, and its notification goes.
- pressKey: Home
- swipe:
    start: 50%, 1%
    end: 50%, 75%
- assertNotVisible: Alerts for ${STAFF_NAME}
- pressKey: Back
